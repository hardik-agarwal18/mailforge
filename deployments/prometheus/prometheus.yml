global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "mailforge-smtp"
    static_configs:
      - targets:
          - "host.docker.internal:9090"

  - job_name: "mailforge-delivery-worker-1"
    static_configs:
      - targets:
          - "host.docker.internal:9091"

  - job_name: "mailforge-delivery-worker-2"
    static_configs:
      - targets:
          - "host.docker.internal:9092"

  - job_name: "mailforge-outbox-publisher"
    static_configs:
      - targets:
          - "host.docker.internal:9096"

  - job_name: "mailforge-smtp-submission"
    static_configs:
      - targets:
          - "host.docker.internal:9095"

  - job_name: "mailforge-postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"

  - job_name: "mailforge-redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"
