groups:
  - name: mailforge-queue-alerts
    rules:
      - alert: MailForgeConsumerGroupLagHigh
        expr: max(mailforge_redis_consumer_group_lag) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MailForge delivery queue is accumulating"
          description: "Consumer group lag has exceeded 100 messages for 2 minutes."

      - alert: MailForgePendingMessagesHigh
        expr: max(mailforge_redis_pending_messages) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Too many pending delivery messages"
          description: "More than 10 Redis messages are pending acknowledgement."

      - alert: MailForgeDeliveryStuck
        expr: max(mailforge_redis_oldest_pending_idle_seconds) > 120
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MailForge delivery appears stuck"
          description: "The oldest pending delivery has been idle for over 120 seconds."

      - alert: MailForgeWorkerDown
        expr: up{job=~"mailforge-delivery-worker-.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MailForge delivery worker is down"
          description: "A delivery worker metrics endpoint is unavailable."

  - name: mailforge-postgres-alerts
    rules:
      - alert: MailForgePostgresExporterDown
        expr: up{job="mailforge-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is unavailable"
          description: "Prometheus cannot scrape PostgreSQL exporter."

      - alert: MailForgePostgresDown
        expr: pg_up{job="mailforge-postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Mailforge PostgreSQL is unavailable"
          description: "PostgreSQL exporter cannot connect to the database."

      - alert: MailForgePostgresConnectionsHigh
        expr: |
          (
            sum(pg_stat_database_numbackends{datname="mailforge"})
            /
            max(pg_settings_max_connections)
          ) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection utilization is high"
          description: "Connection utilization exceeded 85% for two minutes."

      - alert: MailForgePostgresDeadlocks
        expr: |
          sum(rate(
            pg_stat_database_deadlocks{datname="mailforge"}[5m]
          )) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected"
          description: "PostgreSQL is reporting deadlocks."

  - name: mailforge-application-alerts
    rules:
      - alert: MailForgeOutboxBacklogOld
        expr: max(mailforge_outbox_oldest_pending_age_seconds{job="mailforge-outbox-publisher"}) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MailForge outbox publication is falling behind"
          description: "The oldest due outbox event has been waiting for publication for more than 60 seconds."

      - alert: MailForgeDeadOutboxEvents
        expr: max(mailforge_outbox_dead_events{job="mailforge-outbox-publisher"}) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "MailForge has dead outbox events"
          description: "One or more outbox events exhausted automatic retries and require operator inspection."

      - alert: MailForgeOutboxPublisherDown
        expr: up{job="mailforge-outbox-publisher"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "MailForge outbox publisher metrics endpoint is unavailable"
          description: "Prometheus cannot scrape the outbox publisher. Publication may be stopped."

      - alert: MailForgeApplicationPostgresPoolSaturated
        expr: |
          (
            mailforge_postgres_pool_acquired_connections
            /
            clamp_min(mailforge_postgres_pool_max_connections, 1)
          ) > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A MailForge PostgreSQL connection pool is nearly saturated"
          description: "An application pool has used more than 85% of its configured connections for two minutes."

      - alert: MailForgePostgresPoolWaitPressure
        expr: max by (job) (deriv(mailforge_postgres_pool_empty_acquire_wait_seconds[5m])) > 0.10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MailForge application is waiting for PostgreSQL connections"
          description: "An application pool has spent more than 10% of process time waiting for an available connection over the recent five-minute window."

      - alert: MailForgeDeliveryQueueSaturated
        expr: |
          (
            mailforge_delivery_queue_depth
            /
            clamp_min(mailforge_delivery_queue_capacity, 1)
          ) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MailForge delivery worker queue is saturated"
          description: "The in-memory delivery queue has remained above 90% capacity for five minutes."

      - alert: MailForgeDeliveryLeaseRenewalFailures
        expr: increase(mailforge_delivery_lease_renewal_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MailForge failed to renew a delivery lease"
          description: "A delivery lease renewal failed. The affected SMTP operation may have been canceled."

      - alert: MailForgeRedisOperationFailures
        expr: increase(mailforge_redis_operation_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "MailForge Redis operations are failing"
          description: "A Redis queue, acknowledgement, heartbeat or metrics operation failed in the last five minutes."
